<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(TSS_CONFIG.FIREBASE);
const db  = getFirestore(app);

const DEMO = [
  {id:"d1",titulo:"El análisis que Canal 4 no quiso emitir",subtitulo:"Los datos que los grandes medios omiten",contenido:"<p>Durante más de una década, el equipo de TSS trabajó dentro de Canal 4. Pero hay historias que la pauta publicitaria no permite contar.</p><p>En esta investigación revelamos los episodios que fueron censurados, los datos que se omitieron deliberadamente y las presiones que recibió el equipo periodístico para silenciar información de interés público.</p><p><strong>Lo que encontramos fue alarmante:</strong> un patrón sistemático de autocensura motivado por intereses comerciales que compromete el derecho a la información de todos los uruguayos.</p>",categoria:"Investigación",autor:"Nacho Álvarez",estado:"publicado",imageUrl:"https://images.unsplash.com/photo-1504711434969-e33886168d6c?w=800&h=450&fit=crop",createdAt:{seconds:Math.floor(Date.now()/1000)-86400}},
  {id:"d2",titulo:"Los números que el Ministerio prefería que no veas",subtitulo:"Cifras económicas que el gobierno no comunicó",contenido:"<p>Un análisis exhaustivo de las cifras económicas del último trimestre revela una realidad muy distinta a la que presenta el discurso oficial.</p><p>El déficit fiscal creció un 23% respecto al mismo período del año anterior, mientras que la inflación en alimentos superó por tercer mes consecutivo las proyecciones del Banco Central.</p>",categoria:"Economía",autor:"Bernardo Wolloch",estado:"publicado",imageUrl:"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800&h=450&fit=crop",createdAt:{seconds:Math.floor(Date.now()/1000)-172800}},
  {id:"d3",titulo:"El debate sobre narco y política que sacudió la semana",subtitulo:"Conexiones entre crimen organizado y decisiones políticas",contenido:"<p>La conexión entre el crimen organizado y la política uruguaya dejó de ser un tema tabú. Esta semana, tres legisladores fueron mencionados en una investigación judicial que conecta financiamiento de campañas con dinero de origen ilícito.</p><p>TSS accedió a documentos judiciales que demuestran transferencias sospechosas por más de 2 millones de dólares entre 2022 y 2025.</p>",categoria:"Seguridad",autor:"Alejandro Amaral",estado:"publicado",imageUrl:"https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=800&h=450&fit=crop",createdAt:{seconds:Math.floor(Date.now()/1000)-259200}},
  {id:"d4",titulo:"Crisis en el sistema de salud pública: lo que nadie dice",subtitulo:"Hospitales al límite de su capacidad operativa",contenido:"<p>El sistema de salud pública uruguayo enfrenta la peor crisis de recursos en una década. Faltan insumos básicos, las listas de espera para cirugías se extienden a más de 6 meses, y el personal médico trabaja en condiciones de agotamiento extremo.</p><p>TSS visitó cinco hospitales del interior del país y documentó situaciones que contradicen el discurso oficial.</p>",categoria:"Política",autor:"Leonardo Pereyra",estado:"publicado",imageUrl:"https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=800&h=450&fit=crop",createdAt:{seconds:Math.floor(Date.now()/1000)-345600}},
  {id:"d5",titulo:"Marset: todo lo que se sabe y lo que aún falta revelar",subtitulo:"La historia completa del caso que sacudió al Uruguay",contenido:"<p>El caso Marset es el escándalo más grande de la historia reciente del Uruguay. La conexión entre un narcotraficante buscado internacionalmente y funcionarios del más alto nivel del gobierno abrió una herida que aún no cierra.</p><p>En este informe especial, reconstruimos la cronología completa del caso.</p>",categoria:"Investigación",autor:"Alejandro Amaral",estado:"publicado",imageUrl:"https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=800&h=450&fit=crop",createdAt:{seconds:Math.floor(Date.now()/1000)-432000}},
  {id:"d6",titulo:"¿Por qué el periodismo independiente es la única salida?",subtitulo:"Reflexión sobre el rol de los medios en democracia",contenido:"<p>Durante 13 años trabajamos dentro del sistema. Hoy entendemos que la única forma de hacer periodismo de verdad es fuera de él.</p><p>Los medios tradicionales dependen de la pauta publicitaria del Estado y de grandes empresas. Esa dependencia genera una autocensura invisible pero devastadora para la democracia.</p><p><strong>TSS nació de la convicción de que otro periodismo es posible.</strong></p>",categoria:"Editorial",autor:"Nacho Álvarez",estado:"publicado",imageUrl:"",createdAt:{seconds:Math.floor(Date.now()/1000)-518400}},
  {id:"d7",titulo:"El narco en Uruguay: lo que los datos oficiales no dicen",subtitulo:"Cifras reales vs comunicación gubernamental",contenido:"<p>Las cifras oficiales de incautación de drogas muestran un Uruguay que combate eficazmente el narcotráfico. Pero cuando se cruzan esos datos con informes de inteligencia, la realidad es muy diferente.</p><p>Uruguay se consolidó como un hub logístico del narcotráfico sudamericano.</p>",categoria:"Análisis",autor:"Bernardo Wolloch",estado:"publicado",imageUrl:"",createdAt:{seconds:Math.floor(Date.now()/1000)-604800}},

];

let allArticles = [];

async function loadNoticias(cat = "all") {
  showLoading();
  try {
    let q;
    if (cat === "all") q = query(collection(db,"noticias"), orderBy("createdAt","desc"));
    else q = query(collection(db,"noticias"), where("categoria","==",cat), orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    let arts = snap.docs.map(d => ({id:d.id,...d.data()})).filter(a => a.estado === "publicado");
    if (!arts.length) arts = cat === "all" ? DEMO : DEMO.filter(a => a.categoria === cat);
    allArticles = arts;
    renderNoticias(arts);
  } catch(e) {
    console.warn("Firebase:", e.message);
    allArticles = cat === "all" ? DEMO : DEMO.filter(a => a.categoria === cat);
    renderNoticias(allArticles);
  }
}

function renderNoticias(arts) {
  if (!arts.length) { document.getElementById("newsGrid").innerHTML = '<div class="empty">No hay noticias en esta categoría.</div>'; return; }
  const editorials = arts.filter(a => ["Editorial","Análisis"].includes(a.categoria));
  const regular = arts.filter(a => !["Editorial","Análisis"].includes(a.categoria));
  const featured = regular[0] || arts[0];
  const side = (regular.length ? regular : arts).slice(1,3);
  const grid = (regular.length ? regular : arts).slice(3);
  let html = "", d = 0;

  if (featured) {
    const img = featured.imageUrl || "https://images.unsplash.com/photo-1504711434969-e33886168d6c?w=800&h=450&fit=crop";
    html += `<div class="featured-top fade-in" style="animation-delay:${d}ms"><div class="feat-main" onclick="openArticle('${featured.id}')"><div class="feat-main-img"><img src="${img}" alt="" loading="lazy"></div><div class="feat-main-body"><div class="art-cat ${cc(featured.categoria)}">${esc(featured.categoria)}</div><h2>${esc(featured.titulo)}</h2><p>${esc(featured.subtitulo||'')}</p><div class="art-meta"><span>${esc(featured.autor||'TSS')}</span><span>&middot;</span><span>${fd(featured.createdAt)}</span></div><div class="art-read">Leer nota &rarr;</div></div></div><div class="feat-side">`;
    side.forEach(a => {
      const si = a.imageUrl || "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400&h=240&fit=crop";
      html += `<div class="feat-side-art" onclick="openArticle('${a.id}')"><div class="feat-side-img"><img src="${si}" alt="" loading="lazy"></div><div class="feat-side-body"><div class="side-cat">${esc(a.categoria)}</div><div class="side-title">${esc(a.titulo)}</div><div class="side-meta">${esc(a.autor||'TSS')} &middot; ${fd(a.createdAt)}</div></div></div>`;
    });
    html += `</div></div>`; d += 100;
  }
  if (grid.length) {
    html += `<div class="section-label fade-in" style="animation-delay:${d}ms">Más noticias</div>`; d += 80;
    html += '<div class="art-grid">';
    grid.forEach((a,i) => {
      const gi = a.imageUrl || "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400&h=200&fit=crop";
      html += `<div class="art-card fade-in" style="animation-delay:${d+i*60}ms" onclick="openArticle('${a.id}')"><div class="art-card-img"><img src="${gi}" alt="" loading="lazy"></div><div class="art-card-body"><div class="art-card-cat" style="color:${cv(a.categoria)}">${esc(a.categoria)}</div><div class="art-card-title">${esc(a.titulo)}</div><div class="art-card-desc">${esc(a.subtitulo||'')}</div><div class="art-card-meta"><span class="art-card-author">${esc(a.autor||'TSS')}</span><span>${fd(a.createdAt)}</span></div></div></div>`;
    });
    html += '</div>';
  }
  if (editorials.length) {
    d += grid.length*60+100;
    html += `<div class="section-label fade-in" style="animation-delay:${d}ms;color:var(--violet)">Editoriales y Análisis</div>`; d += 80;
    html += '<div class="ed-grid">';
    editorials.forEach((a,i) => {
      html += `<div class="ed-art fade-in" style="animation-delay:${d+i*80}ms" onclick="openArticle('${a.id}')"><div class="ed-art-tag">${esc(a.categoria)}</div><div class="ed-art-title">${esc(a.titulo)}</div><div class="ed-art-desc">${esc(a.subtitulo||'')}</div><div class="ed-art-meta"><span class="ed-art-author">${esc(a.autor||'TSS')}</span><span>&middot;</span><span>${fd(a.createdAt)}</span></div></div>`;
    });
    html += '</div>';
  }
  document.getElementById("newsGrid").innerHTML = html;
}

function showLoading() { document.getElementById("newsGrid").innerHTML = '<div class="loading-wrap"><div class="spinner"></div>Cargando noticias...</div>'; }
function fd(ts) { if (!ts) return ""; const d = ts.toDate ? ts.toDate() : new Date(ts.seconds*1000); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function cc(c) { return {Editorial:"editorial","Análisis":"analisis","Investigación":"investigacion","Economía":"economia"}[c] || ""; }
function cv(c) { return {Política:"var(--cyan)",Economía:"var(--green)",Seguridad:"var(--rose)",Editorial:"var(--violet)","Análisis":"var(--gold)","Investigación":"var(--rose)"}[c] || "var(--cyan)"; }

window.openArticle = id => {
  const a = allArticles.find(x => x.id === id); if (!a) return;
  if(window._trackEvent) window._trackEvent('noticia_leida',{id:a.id,titulo:a.titulo,categoria:a.categoria});
  document.getElementById("artTitle").textContent = a.titulo;
  document.getElementById("artCat").textContent = a.categoria || "";
  document.getElementById("artCat").className = "art-cat " + cc(a.categoria);
  document.getElementById("artAuthor").textContent = a.autor || "TSS";
  document.getElementById("artDate").textContent = fd(a.createdAt);
  document.getElementById("artBody").innerHTML = a.contenido || "<p>Contenido completo próximamente.</p>";
  const img = document.getElementById("artImg");
  if (a.imageUrl) { img.src = a.imageUrl; img.style.display = "block"; } else { img.style.display = "none"; }
  document.getElementById("articleOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
};
window.closeArticle = () => { document.getElementById("articleOverlay").classList.remove("open"); document.body.style.overflow = ""; };
document.getElementById("articleOverlay").addEventListener("click", function(e) { if (e.target === this) closeArticle(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeArticle(); });

window.filterCat = (cat, btn) => {
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadNoticias(cat);
};

const ds=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ms=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const now=new Date();
document.getElementById("pageDate").textContent=ds[now.getDay()]+", "+now.getDate()+" de "+ms[now.getMonth()]+" de "+now.getFullYear();

loadNoticias();
</script>
<!-- ═══ ANALYTICS TRACKER ═══ -->
<script type="module">
import { getFirestore, collection, addDoc, serverTimestamp, doc, setDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
(function(){
  const db = getFirestore();
  const PAGE = location.pathname.split('/').pop() || 'noticias.html';
  const REF = document.referrer;
  const UA = navigator.userAgent;
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(UA);
  const browser = /Edg/i.test(UA)?'Edge':/OPR|Opera/i.test(UA)?'Opera':/Chrome/i.test(UA)?'Chrome':/Safari/i.test(UA)?'Safari':/Firefox/i.test(UA)?'Firefox':'Otro';
  const os = /Windows/i.test(UA)?'Windows':/Mac/i.test(UA)?'Mac':/Android/i.test(UA)?'Android':/iPhone|iPad/i.test(UA)?'iOS':/Linux/i.test(UA)?'Linux':'Otro';
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const lang = navigator.language||'';
  const sw = screen.width; const sh = screen.height;
  function fp(){const s=UA+lang+tz+sw+'x'+sh+(navigator.hardwareConcurrency||0);let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return 'v'+Math.abs(h).toString(36);}
  const vid = fp();
  function src(){if(!REF)return'directo';const r=REF.toLowerCase();if(/google|bing|yahoo|duckduck/i.test(r))return'busqueda';if(/facebook|instagram|twitter|x\.com|tiktok|youtube|telegram|whatsapp/i.test(r))return'social';if(r.includes(location.hostname))return'interno';return'referido';}
  const startTime = Date.now();
  async function trackView(){try{await addDoc(collection(db,'analytics_events'),{type:'pageview',page:PAGE,visitor:vid,source:src(),referrer:REF?REF.substring(0,200):'',device:isMobile?'mobile':'desktop',browser,os,tz,screenRes:sw+'x'+sh,ts:serverTimestamp()});}catch(e){}}
  function trackDuration(){const dur=Math.round((Date.now()-startTime)/1000);if(dur<2)return;try{addDoc(collection(db,'analytics_events'),{type:'session_end',page:PAGE,visitor:vid,duration:dur,ts:serverTimestamp()});}catch(e){}}
  window._trackEvent = async function(n,d){try{await addDoc(collection(db,'analytics_events'),{type:'event',event:n,page:PAGE,visitor:vid,data:d||{},ts:serverTimestamp()});}catch(e){}};
  const presRef = doc(db,'analytics_presence',vid);
  async function setPresence(){try{await setDoc(presRef,{page:PAGE,ts:serverTimestamp(),device:isMobile?'mobile':'desktop'});}catch(e){}}
  async function clearPresence(){try{await deleteDoc(presRef);}catch(e){}}
  trackView(); setPresence();
  document.addEventListener('visibilitychange',()=>{if(document.hidden){trackDuration();clearPresence();}else{setPresence();}});
  window.addEventListener('beforeunload',()=>{trackDuration();clearPresence();});
})();
</script>
