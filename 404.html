<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404 — Todo Se Sabe</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0d0e14;--surface:#1c1e2a;--border:rgba(255,255,255,.08);--t1:#eef0f6;--t2:#8888a0;--cyan:#00e5ff}
body{background:var(--ink);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
.glow-1{top:-100px;left:-100px;background:var(--cyan)}
.glow-2{bottom:-100px;right:-100px;background:#9f7aea}
.container{text-align:center;padding:40px 24px;max-width:480px;position:relative;z-index:1}
.logo{height:64px;border-radius:14px;margin-bottom:32px;background:none}
.code{font-size:120px;font-weight:800;line-height:1;color:var(--cyan);opacity:.15;margin-bottom:-20px;letter-spacing:-8px}
h1{font-size:24px;font-weight:800;margin-bottom:12px;color:var(--t1)}
p{font-size:14px;color:var(--t2);line-height:1.7;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:10px;background:var(--cyan);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;transition:.2s;border:none;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,229,255,.25)}
.links{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.links a{font-size:12px;color:var(--t2);text-decoration:none;transition:.18s;padding:6px 12px;border-radius:6px;border:1px solid var(--border)}
.links a:hover{color:var(--cyan);border-color:rgba(0,229,255,.3)}
.footer{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--t2)}
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
  <img src="icon-192.png" alt="TSS" class="logo">
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el link esté roto o que la página haya sido movida. Volvé al inicio para seguir informándote.</p>
  <a href="/" class="btn">← Volver al inicio</a>
  <div class="links">
    <a href="noticias.html">📰 Noticias</a>
    <a href="https://youtube.com/@todosesabe_tss" target="_blank">▶ YouTube</a>
    <a href="mailto:denuncias@todosesabe.uy">🚨 Denuncias</a>
  </div>
</div>
<div class="footer">© 2026 Todo Se Sabe — Todos los derechos reservados.</div>
</body>
</html>
