<title>404 — TSS Todo Se Sabe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#08090d;--cyan:#00e5ff;--violet:#9f7aea;--t1:#f0f2ff;--t2:#9094b0;--t3:#50536a;--surface:#1c1e2a;--border:rgba(255,255,255,.07)}
body{background:var(--ink);color:var(--t1);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;padding:20px;text-align:center;overflow:hidden}
.glow{position:fixed;inset:0;pointer-events:none}
.g1{position:absolute;width:600px;height:600px;border-radius:50%;background:var(--cyan);opacity:.04;filter:blur(120px);top:-200px;left:-100px}
.g2{position:absolute;width:400px;height:400px;border-radius:50%;background:var(--violet);opacity:.04;filter:blur(100px);bottom:-100px;right:-100px}
.logo{height:50px;width:auto;margin-bottom:40px}
.num{font-size:clamp(80px,20vw,160px);font-weight:900;line-height:1;letter-spacing:-6px;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h1{font-size:clamp(18px,4vw,28px);font-weight:800;color:var(--t1);margin-bottom:12px;letter-spacing:-.5px}
p{font-size:15px;color:var(--t2);line-height:1.65;max-width:400px;margin-bottom:36px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn-home{padding:12px 28px;border-radius:10px;background:var(--cyan);color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;transition:.18s;display:inline-flex;align-items:center;gap:8px}
.btn-home:hover{background:#33eeff;transform:translateY(-2px)}
.btn-back{padding:12px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.12);color:var(--t1);font-size:14px;font-weight:500;text-decoration:none;transition:.18s}
.btn-back:hover{border-color:var(--cyan);background:rgba(0,229,255,.08)}
.hint{font-size:11px;color:var(--t3);margin-top:40px;letter-spacing:.5px}
</style>
</head>
